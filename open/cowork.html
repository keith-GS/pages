<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Opening in Cowork</title>
<style>body{font:16px -apple-system,system-ui,sans-serif;background:#111;color:#eee;display:grid;place-items:center;height:100vh;margin:0}
a{display:inline-block;margin-top:14px;padding:10px 18px;background:#d97757;color:#fff;border-radius:8px;text-decoration:none}p{color:#aaa;font-size:14px}</style></head>
<body><div style="text-align:center"><div id="m">Opening the session in Claude Cowork...</div>
<a id="b" href="#">Open in Claude</a><p>You can close this tab.</p></div>
<script>
(function(){var s=new URLSearchParams(location.search).get('s')||'';
if(/^session_[A-Za-z0-9]{10,40}$/.test(s)) s='cse_'+s.slice(8);
if(!/^cse_[A-Za-z0-9]{10,40}$/.test(s)){document.getElementById('m').textContent='That link is missing a valid session id.';document.getElementById('b').style.display='none';return;}
var u='claude://claude.ai/cowork/'+s;document.getElementById('b').href=u;var t0=Date.now();window.addEventListener('blur',function(){if(Date.now()-t0<8000)setTimeout(function(){try{window.close()}catch(e){}},2500);});location.href=u;
})();
</script></body></html>
