<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Lora:ital@1&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0}
  body{
    width:1200px;height:630px;
    background:
      radial-gradient(50% 60% at 50% 20%, rgba(201,169,110,0.18) 0%, rgba(201,169,110,0) 60%),
      linear-gradient(180deg, #15110f 0%, #0a0908 100%);
    color:#f5efe6;
    font-family:'Cormorant Garamond',Georgia,serif;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    text-align:center;
    position:relative;
  }
  .crest{
    font-family:'Cormorant Garamond',serif;
    font-size:14px;letter-spacing:0.5em;text-transform:uppercase;
    color:#c9a96e;
    margin-bottom:36px;
  }
  h1{
    font-weight:300;
    font-size:128px;
    line-height:0.95;
    margin:0;
    letter-spacing:0.01em;
  }
  h1 .accent{
    font-family:'Lora',Georgia,serif;
    font-style:italic;
    color:#c9a96e;
    font-weight:400;
  }
  .tagline{
    margin-top:38px;
    font-family:'Lora',Georgia,serif;
    font-style:italic;
    color:#d8ccb6;
    font-size:28px;
    letter-spacing:0.02em;
  }
  .ornament{
    margin-top:48px;
    display:flex;align-items:center;justify-content:center;gap:18px;color:#c9a96e;
  }
  .ornament .bar{height:1px;width:120px;background:#c9a96e;opacity:0.7}
  .ornament .dot{font-size:14px;letter-spacing:0.6em}
  .meta{
    position:absolute;bottom:48px;left:0;right:0;
    text-align:center;
    font-family:'Cormorant Garamond',serif;
    font-size:14px;letter-spacing:0.4em;text-transform:uppercase;
    color:rgba(245,239,230,0.6);
  }
  /* corner ornaments */
  .corner{position:absolute;width:64px;height:64px;border:1px solid #c9a96e;opacity:0.4}
  .corner.tl{top:48px;left:48px;border-right:none;border-bottom:none}
  .corner.tr{top:48px;right:48px;border-left:none;border-bottom:none}
  .corner.bl{bottom:48px;left:48px;border-right:none;border-top:none}
  .corner.br{bottom:48px;right:48px;border-left:none;border-top:none}
</style>
</head>
<body>
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
  <div class="crest">est. mmxxvi - new york</div>
  <h1>The <span class="accent">Punjabi</span> Collection</h1>
  <div class="tagline">A private archive of heritage and contemporary jewelry</div>
  <div class="ornament">
    <span class="bar"></span><span class="dot">- - -</span><span class="bar"></span>
  </div>
  <div class="meta">curated for leena punjabi</div>
</body>
</html>
